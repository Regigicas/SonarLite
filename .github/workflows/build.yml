name: build

on:
  push:
    branches: [main]
    # Documentation-only changes do not need a build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build SonarLite.slnx -c Release --nologo
      - run: dotnet publish src/SonarLite -c Release --no-build -o publish --nologo
      - uses: actions/upload-artifact@v7
        with:
          name: SonarLite-${{ github.sha }}
          path: publish/
          if-no-files-found: error
